name: Prepare Atlanta production domain
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update domain and static asset config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'your-domain.com'
          new = 'atlanta.privatemoneyloans.click'
          for name in ('astro.config.mjs', 'src/data/cities.ts', 'public/robots.txt'):
              p=Path(name)
              text=p.read_text()
              assert old in text, name
              p.write_text(text.replace(old,new))
          Path('wrangler.jsonc').write_text('''{"name":"atlanta-fix-flip-loan","compatibility_date":"2026-09-27","assets":{"directory":"./dist"}}\n''')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add astro.config.mjs src/data/cities.ts public/robots.txt wrangler.jsonc
          git diff --cached --quiet || (git commit -m 'Configure Atlanta loan production domain and Cloudflare assets' && git push)
